# Local development stack: API + queue worker + scheduler + PostgreSQL.
# Usage: docker compose up --build   (API on http://localhost:8000)
x-app: &app
  build: .
  env_file: .env
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: attendance
      DB_USERNAME: attendance
      DB_PASSWORD: attendance
      APP_ENV: local
      CONTAINER_ROLE: app
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8080"

  worker:
    <<: *app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: attendance
      DB_USERNAME: attendance
      DB_PASSWORD: attendance
      APP_ENV: local
      CONTAINER_ROLE: worker
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: attendance
      DB_USERNAME: attendance
      DB_PASSWORD: attendance
      APP_ENV: local
      CONTAINER_ROLE: scheduler
    healthcheck:
      disable: true

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance   # local development only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
